name: Build LyricDash

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Create Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LyricDash.xcodeproj \
            -scheme LyricDash \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Check the app contains the lyrics card
        run: |
          APP=build/Build/Products/Release-iphoneos/LyricDash.app
          test -d "$APP/PlugIns/LyricDashWidget.appex"
          plutil -extract NSSupportsLiveActivities raw "$APP/Info.plist"
          plutil -extract UIBackgroundModes json -o - "$APP/Info.plist"

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LyricDash.app Payload/
          zip -qr LyricDash.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LyricDash-ipa
          path: LyricDash.ipa

      - name: Save build log (for troubleshooting)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
